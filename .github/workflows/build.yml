name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Necessário para o bot ler todo o histórico de commits

    - name: Calcular Próxima Versão (Semantic Release)
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch # Se nenhum commit usar prefixo, por padrão sobe uma patch
        release_branches: main,master
        create_annotated_tag: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x' # Using net10.0 as per your project

    - name: Restore dependencies
      run: dotnet restore

    - name: Check Formatting
      run: dotnet format --verify-no-changes

    - name: Build com Versão Injetada
      run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.tag_version.outputs.new_version }}

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=TestResults/

    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: GlamourChecker.Tests/TestResults/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both

    - name: Write to Job Summary
      shell: bash
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
      if: always()

    - name: Archive Release
      if: success() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v3
      with:
        name: GlamourChecker
        path: GlamourChecker/bin/Release/GlamourChecker/

    - name: Publish Release artifact
      if: success() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v3
      with:
        name: GlamourChecker-Release-Zip
        path: GlamourChecker/bin/Release/GlamourChecker/latest.zip

    - name: Criar GitHub Release
      if: success() && github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        body: ${{ steps.tag_version.outputs.changelog }}
        files: GlamourChecker/bin/Release/GlamourChecker/latest.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
