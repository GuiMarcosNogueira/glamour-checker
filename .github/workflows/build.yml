name: Build and Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - '.gitignore'
      - 'tools/**'
      - 'GlamourChecker.Tests/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necessário para o bot ler todo o histórico de commits

    - name: Calcular Próxima Versão (Semantic Release)
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch # Se nenhum commit usar prefixo, por padrão sobe uma patch
        release_branches: main,master
        create_annotated_tag: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Using net10.0 as per your project

    - name: Download Dalamud
      shell: python
      run: |
        import urllib.request
        import json
        import os
        import zipfile
        import shutil

        headers = {'User-Agent': 'GlamourChecker-CI/1.0'}
        req = urllib.request.Request('https://kamori.goats.dev/Dalamud/Release/VersionInfo', headers=headers)
        with urllib.request.urlopen(req) as response:
            data = json.loads(response.read().decode())
        
        download_url = data['downloadUrl']
        print(f"Downloading Dalamud from {download_url}...")
        
        # Download zip with headers to avoid 403 Forbidden
        dl_req = urllib.request.Request(download_url, headers=headers)
        with urllib.request.urlopen(dl_req) as response, open('dalamud.zip', 'wb') as out_file:
            shutil.copyfileobj(response, out_file)
        
        # Extract to expected directory
        appdata = os.environ.get('APPDATA')
        dest_dir = os.path.join(appdata, 'XIVLauncher', 'addon', 'Hooks', 'dev')
        os.makedirs(dest_dir, exist_ok=True)
        
        with zipfile.ZipFile('dalamud.zip', 'r') as zip_ref:
            zip_ref.extractall(dest_dir)
            
        print(f"Dalamud extracted to {dest_dir}")

    - name: Restore dependencies
      run: dotnet restore

    - name: Check Formatting
      run: dotnet format --verify-no-changes

    - name: Build com Versão Injetada
      run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.tag_version.outputs.new_version }}

    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=TestResults/

    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.4
      with:
        reports: 'GlamourChecker.Tests/TestResults/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'MarkdownSummaryGithub'

    - name: Write to Job Summary
      shell: bash
      run: if [ -f coveragereport/SummaryGithub.md ]; then cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY; fi
      if: always()

    - name: Archive Release
      if: success() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: GlamourChecker
        path: GlamourChecker/bin/Release/GlamourChecker/

    - name: Publish Release artifact
      if: success() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: GlamourChecker-Release-Zip
        path: GlamourChecker/bin/Release/GlamourChecker/latest.zip

    - name: Parse CHANGELOG.md for Release Notes
      if: success() && github.event_name != 'pull_request'
      id: changelog_reader
      shell: python
      run: |
        import re
        with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
            content = f.read()
        
        # Get the new version without the 'v' prefix
        new_version = "${{ steps.tag_version.outputs.new_version }}"
        
        # Regex to find everything under ## [Unreleased] OR ## [new_version] up to the next ## [ or ---
        pattern = r'## \[(?:Unreleased|' + re.escape(new_version) + r')\].*?\n(.*?)(?=\n## \[|\n---)'
        match = re.search(pattern, content, re.DOTALL)
        release_notes = match.group(1).strip() if match else "No release notes found."
        
        with open('release_body.md', 'w', encoding='utf-8') as f:
            f.write(release_notes)
            
    - name: Criar GitHub Release
      if: success() && github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        body_path: release_body.md
        files: GlamourChecker/bin/Release/GlamourChecker/latest.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Custom Repo (pluginmaster.json)
      if: success() && github.event_name != 'pull_request'
      shell: bash
      run: |
        cat << 'EOF' > generate_repo.py
        import json
        import sys

        repo_url = sys.argv[1]
        tag_name = sys.argv[2]
        manifest_path = "GlamourChecker/bin/Release/GlamourChecker/GlamourChecker.json"
        
        with open(manifest_path, 'r', encoding='utf-8') as f:
            plugin = json.load(f)
            
        download_url = f"https://github.com/{repo_url}/releases/download/{tag_name}/latest.zip"
        plugin["DownloadLinkInstall"] = download_url
        plugin["DownloadLinkUpdate"] = download_url
        plugin["DownloadLinkTesting"] = download_url
        
        with open("pluginmaster.json", "w", encoding='utf-8') as f:
            json.dump([plugin], f, indent=4)
        EOF
        python generate_repo.py ${{ github.repository }} ${{ steps.tag_version.outputs.new_tag }}
        mkdir -p gh-pages
        mv pluginmaster.json gh-pages/
        cp -r images gh-pages/
        
        cat << 'EOF' > gh-pages/index.html
        <!DOCTYPE html>
        <html>
        <head>
            <title>Glamour Checker Custom Repo</title>
            <meta http-equiv="refresh" content="0; url=https://github.com/${{ github.repository }}" />
            <style>
                body { background-color: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
                a { color: #58a6ff; }
            </style>
        </head>
        <body>
            <h1>Glamour Checker Custom Repo</h1>
            <p>This is a Dalamud Custom Repository.</p>
            <p>Please copy the link ending in <code>/pluginmaster.json</code> to Dalamud.</p>
            <p>Redirecting to the <a href="https://github.com/${{ github.repository }}">GitHub repository</a>...</p>
        </body>
        </html>
        EOF

    - name: Deploy Custom Repo to GitHub Pages
      if: success() && github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
        force_orphan: true

