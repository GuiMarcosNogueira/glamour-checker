name: Update Visual Dictionary

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch: # Allow manual triggering

jobs:
  update-dictionary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Run Scraper
        run: |
          cd tools
          python garland_scraper.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_TOKEN }}
          commit-message: "fix: update shared models dictionary"
          title: "fix: update shared models dictionary"
          body: "Automated update of the visual dictionary via GarlandTools scraper."
          branch: "bot/update-shared-models"
          delete-branch: true
